name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  ## lehetővé teszi, hogy "kézzel" elindítsam a folyamatot
  workflow_dispatch:

    # időzített indítás
  schedule:
    - cron: '10 04 * * *'  # Minden nap 04:10-kor

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: generate image tag
      run: |
        echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV    


    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: 
        docker build . --file Dockerfile --tag CI-CD-teszt-13A-A-csoport:$IMAGE_TAG
        docker login ghcr.io -u veryoriginalik -p ${{ secrets.GHCR_TOKEN }}
        docker push ghcr.io/veryoriginalik/CI-CD-teszt-13A-A-csoport:$IMAGE_TAG
